name: Daily AI Image Generator

on:
  schedule:
    # This runs every single day at 9:00 AM UTC (Change 9 to whatever UTC hour you want)
    - cron: '0 9 * * *'
  workflow_dispatch: # This adds a manual "Play" button so you can test it anytime

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install required tools
      run: pip install requests

    - name: Run the image generator script
      run: python generate_art.py

    - name: Save the image back to GitHub
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git add generated_images/*
        git commit -m "Automated daily image upload" || exit 0
        git push
