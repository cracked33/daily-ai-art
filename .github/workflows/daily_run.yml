name: Frequent AI Image Generator

on:
  schedule:
    # This CRON expression instructs GitHub to run this script exactly EVERY 2 HOURS
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows you to manually trigger it whenever you want a bonus image

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install required tools
      run: pip install requests

    - name: Run the image generator script
      run: python generate_art.py

    - name: Save the image back to GitHub
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git add generated_images/*
        git commit -m "Automated hourly/frequent image upload" || exit 0
        git push
